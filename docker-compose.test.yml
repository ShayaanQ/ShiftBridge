services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiftbridge
      POSTGRES_PASSWORD: shiftbridge
      POSTGRES_DB: shiftbridge_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftbridge -d shiftbridge_test"]
      interval: 2s
      timeout: 3s
      retries: 15
