services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiftbridge
      POSTGRES_PASSWORD: shiftbridge
      POSTGRES_DB: shiftbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftbridge -d shiftbridge"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://shiftbridge:shiftbridge@postgres:5432/shiftbridge?schema=public
      JWT_SECRET: development-only-change-me
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
